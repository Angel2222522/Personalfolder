name: Build Personal Folder test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/personal-folder-rapid-no-emulator
    paths:
      - .github/workflows/build-signed-test-apk.yml

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install build SDK only
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK from current remediation branch
        run: gradle assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalFolder-v2.0.1-ocrfix-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
