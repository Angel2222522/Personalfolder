name: Build signed Personal Folder test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/personal-folder-rapid-no-emulator
    paths:
      - .github/workflows/build-signed-test-apk.yml

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install build SDK only
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare permanent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_FOLDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_FOLDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PERSONAL_FOLDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PERSONAL_FOLDER_KEY_PASSWORD }}
        run: ./scripts/prepare-signing.sh

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Verify permanent release signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          if [[ "$(basename "$APK")" == *unsigned* ]]; then
            echo "Release APK is unsigned."
            exit 1
          fi
          apksigner verify --verbose --print-certs "$APK"
          EXPECTED_SHA256="2642FD5E5E43A90EB6DA7B3462E14313BE9DA8C479ECAABC404076071F0A049B"
          APK_SHA256=$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$APK_SHA256" = "$EXPECTED_SHA256"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalFolder-v2.0.1-signed-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
