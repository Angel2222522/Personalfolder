name: Android build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run lint
        run: gradle lintDebug
      - name: Compile instrumentation tests
        run: gradle assembleDebugAndroidTest
      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle connectedDebugAndroidTest
      - name: Build debug APK
        if: always()
        run: gradle assembleDebug
      - name: Verify release build
        if: always()
        run: gradle assembleRelease
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload release APK verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-release-apk-verification
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-room-schemas
          path: app/schemas/
          if-no-files-found: ignore
