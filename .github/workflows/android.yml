name: Android build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-28" "system-images;android-28;default;x86"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run lint
        run: gradle lintDebug

      - name: Compile instrumentation tests
        run: gradle assembleDebugAndroidTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The hosted runner has no KVM access. API 35 and API 30 Google APIs
          # images remained offline and never exposed the package service. A
          # small API 28 default image still exercises PdfRenderer, Room and
          # Android Keystore while avoiding the unnecessary Google-services
          # boot cost for these tests.
          api-level: 28
          target: default
          arch: x86
          # avdmanager uses the lowercase hardware-profile identifier on the
          # current GitHub runner SDK. The display name `Pixel_2` is not a
          # valid device id there and prevents instrumentation from starting.
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          disable-animations: true
          script: |
            set +e
            gradle connectedDebugAndroidTest --stacktrace
            status=$?
            adb logcat -d -b all -v threadtime > "$RUNNER_TEMP/personal-folder-instrumentation-logcat.txt" || true
            echo "--- Recent device logcat after instrumentation failure ---"
            tail -n 400 "$RUNNER_TEMP/personal-folder-instrumentation-logcat.txt" || true
            exit "$status"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-instrumentation-diagnostics
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/personal-folder-instrumentation-logcat.txt
          if-no-files-found: ignore

      - name: Verify unsigned release compilation on pull requests
        if: github.event_name == 'pull_request'
        run: gradle assembleRelease

      - name: Prepare permanent release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_FOLDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_FOLDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PERSONAL_FOLDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PERSONAL_FOLDER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Permanent Personal Folder release signing secrets are missing. Refusing to produce a release APK."
              exit 1
