name: Personal Folder no-emulator verification

on:
  push:
    branches:
      - codex/personal-folder-rapid-no-emulator

permissions:
  contents: read

jobs:
  verify-without-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build SDK only
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run lint
        run: gradle lintDebug

      - name: Compile instrumentation tests without running them
        run: gradle assembleDebugAndroidTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-no-emulator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify unsigned release compilation
        run: gradle assembleRelease

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-folder-no-emulator-room-schemas
          path: app/schemas/
          if-no-files-found: ignore
